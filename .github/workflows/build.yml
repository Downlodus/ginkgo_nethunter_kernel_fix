name: Build Ginkgo NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bison flex python3 gzip tar xz-utils \
            make gcc perl gawk swig pkg-config zstd device-tree-compiler bc \
            libssl-dev libncurses-dev

      - name: Run build script
        run: |
          chmod +x build.sh dtc
          yes | ./build.sh

      - name: Collect artifacts into workspace
        if: always()
        run: |
          mkdir -p out
          shopt -s nullglob
          echo "--- Searching workspace root ---"
          ls -la .
          for f in *.zip *.tar.gz; do
            [ -f "$f" ] && mv "$f" out/
          done
          echo "--- Searching one level up (fallback) ---"
          for f in ../*.zip ../*.tar.gz; do
            [ -f "$f" ] && mv "$f" out/
          done
          echo "Collected files:"
          ls -la out/ || true

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-nethunter-kernel
          path: out/
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .config
            *.log
          if-no-files-found: ignore
