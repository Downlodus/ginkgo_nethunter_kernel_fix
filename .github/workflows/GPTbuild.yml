```yaml
name: Build Ginkgo NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl bison flex python3 gzip tar xz-utils \
            make gcc perl gawk swig pkg-config zstd \
            device-tree-compiler bc libssl-dev libncurses-dev

      - name: Run build script
        run: |
          chmod +x build.sh dtc
          yes | ./build.sh

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts

          echo "Searching for ZIP files..."
          find . -maxdepth 3 -type f -name "*.zip" -print

          echo "Searching for TAR.GZ files..."
          find . -maxdepth 3 -type f -name "*.tar.gz" -print

          # Files created in the parent directory
          find .. -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) \
            -exec cp -v {} artifacts/ \;

          # Files created inside the repository
          find . -maxdepth 3 -type f \( -name "*.zip" -o -name "*.tar.gz" \) \
            -exec cp -v {} artifacts/ \;

          echo "Collected artifacts:"
          ls -lah artifacts/

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-nethunter-kernel
          path: artifacts/*
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .config
            *.log
          if-no-files-found: ignore
```
